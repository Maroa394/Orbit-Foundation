services:
  - type: web
    name: orbit-foundation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: orbit-db
    plan: free
    databaseName: orbit
    user: orbit_user
