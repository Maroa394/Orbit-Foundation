services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - orbit_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:change-this-password@db:5432/orbit
      SECRET_KEY: change-this-to-a-long-random-secret
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  orbit_db:
